[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "unibot-mcp-servers"
version = "0.1.0"
description = "Collection of MCP servers for UniBot"
authors = [{ name = "Mergoth" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
]

[tool.poetry]
packages = [
    { include = "unibot_mcp_servers", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
uvicorn = "^0.34.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
