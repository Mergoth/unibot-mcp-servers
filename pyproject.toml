[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "unibot-mcp-servers"
version = "0.1.0"
description = "Collection of MCP servers for UniBot"
authors = [{ name = "Mergoth" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=3.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
    "fastapi (>=0.137.2,<0.138.0)",
    "google-api-python-client (>=2.190.0,<3.0.0)",
    "google-auth (>=2.48.0,<3.0.0)",
    "google-auth-httplib2 (>=0.3.0,<0.4.0)",
]

[tool.poetry]
packages = [
    { include = "unibot_mcp_servers", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
python-dotenv = "^1.2.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
